    // ============================================================
    // TRANSACTIONS TAB
    // ============================================================

    // Store transactions data for tab re-rendering
    let _transactionsData = null;

    function renderTransactions(data, settings, monthIndex) {
        const container = document.getElementById('transactionsContainer');
        const currentYear = new Date().getFullYear();
        const today = new Date();
        const currentMonthIndex = today.getMonth();
        const todayDay = today.getDate();

        // Expand scheduled transactions
        const { expanded: expandedTransactions } =
            expandScheduledTransactions(data.scheduledTransactions, currentYear);

        // Combine actual and scheduled transactions for the selected month
        const allTransactions = [];

        // Helper to check if transaction is a transfer (should be ignored)
        const isTransfer = (t) => {
            const category = t.category_name || '';
            const payee = t.payee_name || '';
            return category === 'Uncategorized' && payee.startsWith('Transfer');
        };

        // Helper to check if transaction should be included
        // Include: high-priority flexible transactions (1-5) OR income
        const shouldInclude = (t) => {
            const category = t.category_name || '';
            const isFlexible = isHighPriorityFlexible(category, settings.flexiblePrefix);
            const isIncome = category === 'Inflow: Ready to Assign';
            return isFlexible || isIncome;
        };

        // 1. Actual transactions from YNAB
        const actualTxns = (data.transactions || []).filter(t => {
            const txDate = new Date(t.date);
            return txDate.getMonth() === monthIndex &&
                   txDate.getFullYear() === currentYear &&
                   !isTransfer(t) &&
                   shouldInclude(t);
        });

        for (const t of actualTxns) {
            allTransactions.push({
                date: t.date,
                day: new Date(t.date).getDate(),
                when: 'Past',
                category: t.category_name || '(Uncategorized)',
                payee: t.payee_name || '(No payee)',
                amount: t.amount / 1000,
                source: 'actual'
            });
        }

        // 2. Scheduled transactions for the selected month
        const scheduledForMonth = expandedTransactions.filter(t =>
            t.occurrence_month === monthIndex &&
            t.occurrence_year === currentYear &&
            !isTransfer(t) &&
            shouldInclude(t)
        );

        for (const t of scheduledForMonth) {
            // Determine when: Past or Future
            let when;
            if (monthIndex < currentMonthIndex) {
                // Past month - all scheduled would be "Past"
                when = 'Past';
            } else if (monthIndex > currentMonthIndex) {
                // Future month - all scheduled are "Future"
                when = 'Future';
            } else {
                // Current month - check day
                const txDay = new Date(t.date_next).getDate();
                when = txDay < todayDay ? 'Past' : 'Future';
            }

            allTransactions.push({
                date: t.date_next,
                day: new Date(t.date_next).getDate(),
                when: when,
                category: t.category_name || '(Uncategorized)',
                payee: t.payee_name || '(No payee)',
                amount: t.amount / 1000,
                source: 'scheduled'
            });
        }

        // Sort by day of month
        allTransactions.sort((a, b) => a.day - b.day);

        if (allTransactions.length === 0) {
            container.innerHTML = '<div class="empty-state">No transactions for this month</div>';
            return;
        }

        // Classify transaction type
        const classifyType = (tx) => {
            if (tx.amount > 0 && tx.category === 'Inflow: Ready to Assign') {
                return 'Income';
            } else if (tx.amount > 0) {
                return 'Refund';
            } else {
                return 'Transaction';
            }
        };

        // Build table rows
        let tableRows = '';
        for (const tx of allTransactions) {
            const type = classifyType(tx);
            const amountClass = tx.amount >= 0 ? 'positive' : 'negative';
            const sourceIndicator = tx.source === 'scheduled' ? ' 📅' : '';

            tableRows += `
                <tr>
                    <td>${tx.when}${sourceIndicator}</td>
                    <td>${type}</td>
                    <td>${tx.category}</td>
                    <td>${tx.payee}</td>
                    <td class="${amountClass}">${formatCurrency(tx.amount)}</td>
                </tr>
            `;
        }

        // Calculate totals
        const totalIncome = allTransactions
            .filter(tx => classifyType(tx) === 'Income')
            .reduce((sum, tx) => sum + tx.amount, 0);
        const totalRefunds = allTransactions
            .filter(tx => classifyType(tx) === 'Refund')
            .reduce((sum, tx) => sum + tx.amount, 0);
        const totalExpenses = allTransactions
            .filter(tx => classifyType(tx) === 'Transaction')
            .reduce((sum, tx) => sum + tx.amount, 0);
        const netTotal = totalIncome + totalRefunds + totalExpenses;

        container.innerHTML = `
            <div class="transactions-table-wrapper">
                <table class="transactions-table">
                    <thead>
                        <tr>
                            <th>When</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Payee</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4"><strong>Income</strong></td>
                            <td class="positive"><strong>${formatCurrency(totalIncome)}</strong></td>
                        </tr>
                        <tr>
                            <td colspan="4"><strong>Refunds</strong></td>
                            <td class="positive"><strong>${formatCurrency(totalRefunds)}</strong></td>
                        </tr>
                        <tr>
                            <td colspan="4"><strong>Expenses</strong></td>
                            <td class="negative"><strong>${formatCurrency(totalExpenses)}</strong></td>
                        </tr>
                        <tr>
                            <td colspan="4"><strong>Net</strong></td>
                            <td class="${netTotal >= 0 ? 'positive' : 'negative'}"><strong>${formatCurrency(netTotal)}</strong></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        `;
    }

    // Initialize transactions tab
    function initTransactionsTab() {
        const monthSelect = document.getElementById('transactionsMonth');

        // Set default to current month
        const currentMonth = new Date().getMonth();
        monthSelect.value = currentMonth.toString();

        // Re-render on month change
        monthSelect.addEventListener('change', () => {
            if (!_transactionsData) return;
            const settings = loadSettings();
            const monthIndex = parseInt(monthSelect.value, 10);
            renderTransactions(_transactionsData, settings, monthIndex);
        });
    }

    // Initialize projects tab
    function initProjectsTab() {
        const yearFilter = document.getElementById('projectsYearFilter');
        const priorityFilter = document.getElementById('projectsPriorityFilter');
        const fixedFilter = document.getElementById('projectsFixedFilter');

        const onChange = () => {
            if (!_projectsData) return; // No data loaded yet
            const settings = loadSettings();
            renderProjectsTab(_projectsData, settings);
        };

        yearFilter.addEventListener('change', onChange);
        priorityFilter.addEventListener('change', onChange);
        fixedFilter.addEventListener('change', onChange);
    }

    // ============================================================
    // PROJECTS TAB
    // ============================================================

    // Store category group mapping for projects tab
    let _categoryGroupMap = {};
    let _projectsExportData = [];
    let _projectsData = null;

    function buildCategoryGroupMap(monthsData) {
        // Build a mapping of category_name → category_group_name from the first month with data
        const map = {};
        for (const month of monthsData) {
            if (month && month.categories) {
                for (const cat of month.categories) {
                    if (!map[cat.name]) {
                        map[cat.name] = cat.category_group_name || 'Ungrouped';
                    }
                }
            }
        }
        return map;
    }

    function renderProjectsTab(data, settings) {
        _projectsData = data; // Store for re-rendering on filter change

        const container = document.getElementById('projectsContainer');
        const currentYear = new Date().getFullYear();
        const today = new Date();

        // Read filter checkbox states
        const yearFilterEnabled = document.getElementById('projectsYearFilter')?.checked ?? true;
        const priorityFilterEnabled = document.getElementById('projectsPriorityFilter')?.checked ?? true;
        const includeFixedEnabled = document.getElementById('projectsFixedFilter')?.checked ?? false;

        // Build category group map from months data
        _categoryGroupMap = buildCategoryGroupMap(data.months);

        // Expand scheduled transactions - include additional years if year filter is disabled
        let expandedTransactions = [];
        if (yearFilterEnabled) {
            const result = expandScheduledTransactions(data.scheduledTransactions, currentYear);
            expandedTransactions = result.expanded;
        } else {
            // Expand for current year and next 2 years to show future transactions
            for (let year = currentYear; year <= currentYear + 2; year++) {
                const result = expandScheduledTransactions(data.scheduledTransactions, year);
                expandedTransactions = expandedTransactions.concat(result.expanded);
            }
        }

        // Get ACTUAL transactions (optionally filtered by year, priority, and fixed/flexible)
        const actualTransactions = (data.transactions || []).filter(t => {
            const txDate = new Date(t.date);
            if (yearFilterEnabled && txDate.getFullYear() !== currentYear) return false;
            // Must have a category
            if (!t.category_name) return false;
            // Exclude uncategorized transfers
            if (t.category_name === 'Uncategorized' && (t.payee_name || '').startsWith('Transfer')) return false;

            // Check if flexible or fixed category
            const isFlexible = t.category_name.startsWith(settings.flexiblePrefix);
            if (isFlexible) {
                // For flexible categories, apply priority filter if enabled
                if (priorityFilterEnabled && !isHighPriorityFlexible(t.category_name, settings.flexiblePrefix)) return false;
            } else {
                // For fixed categories, only include if fixed filter is enabled
                if (!includeFixedEnabled) return false;
            }
            return true;
        });

        // Build a set of category+month combinations that have actual transactions
        // Used to exclude scheduled transactions when an actual already exists for that category/month
        const actualsExist = new Set();
        for (const t of actualTransactions) {
            const txMonth = new Date(t.date).getMonth();
            actualsExist.add(`${t.category_name}|${txMonth}`);
        }

        // Get SCHEDULED transactions (optionally filtered by year, priority, and fixed/flexible)
        // Use start of today for date comparisons (midnight)
        const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());

        const scheduledTransactions = expandedTransactions.filter(t => {
            if (yearFilterEnabled && t.occurrence_year !== currentYear) return false;
            // Must have a category
            if (!t.category_name) return false;

            // Check if flexible or fixed category
            const isFlexible = t.category_name.startsWith(settings.flexiblePrefix);
            if (isFlexible) {
                // For flexible categories, apply priority filter if enabled
                if (priorityFilterEnabled && !isHighPriorityFlexible(t.category_name, settings.flexiblePrefix)) return false;
            } else {
                // For fixed categories, only include if fixed filter is enabled
                if (!includeFixedEnabled) return false;
            }

            // Build the occurrence date the same way as when rendering
            // Clamp day to last valid day of month to avoid overflow
            const txDay = new Date(t.date_next).getDate();
            const txYear = t.occurrence_year || currentYear;
            const lastDayOfMonth = new Date(txYear, t.occurrence_month + 1, 0).getDate();
            const clampedDay = Math.min(txDay, lastDayOfMonth);
            const occurrenceDate = new Date(txYear, t.occurrence_month, clampedDay);

            // Exclude scheduled transactions for dates that have already passed
            if (occurrenceDate < todayStart) return false;

            // For recurring transactions (monthly, weekly, etc.), exclude if an actual already exists
            // for this category+month. One-off transactions (frequency='never') are not filtered
            // since they could be separate from existing actuals (e.g., concert ticket + refund)
            if (t.frequency && t.frequency !== 'never') {
                if (actualsExist.has(`${t.category_name}|${t.occurrence_month}`)) return false;
            }

            return true;
        });

        // Combine actual and scheduled, marking source
        const allTransactions = [];

        for (const t of actualTransactions) {
            allTransactions.push({
                date: t.date,
                category_id: t.category_id || '',
                category_name: t.category_name,
                payee_name: t.payee_name,
                memo: t.memo || '',
                amount: t.amount,
                source: 'actual'
            });
        }

        for (const t of scheduledTransactions) {
            // For scheduled, use date_next and occurrence info
            // Build a date string for the occurrence month
            // Clamp day to last valid day of month to avoid overflow (e.g., Apr 31 → May 1)
            const txYear = t.occurrence_year || currentYear;
            const dayFromDateNext = new Date(t.date_next).getDate();
            const lastDayOfMonth = new Date(txYear, t.occurrence_month + 1, 0).getDate();
            const clampedDay = Math.min(dayFromDateNext, lastDayOfMonth);
            // Format date manually to avoid timezone issues with toISOString()
            const month = String(t.occurrence_month + 1).padStart(2, '0');
            const day = String(clampedDay).padStart(2, '0');
            const dateStr = `${txYear}-${month}-${day}`;
            allTransactions.push({
                date: dateStr,
                category_id: t.category_id || '',
                category_name: t.category_name,
                payee_name: t.payee_name,
                memo: t.memo || '',
                amount: t.amount,
                source: 'scheduled',
                isFutureYear: txYear > currentYear
            });
        }

        // Store allTransactions for CSV export
        // Negate amount so expenses are positive (same as display)
        _projectsExportData = allTransactions.map(t => ({
            category_id: t.category_id,
            category_group: _categoryGroupMap[t.category_name] || 'Ungrouped',
            category_name: t.category_name,
            date: t.date,
            month: new Date(t.date).toLocaleString('en-IE', { month: 'long' }),
            payee: t.payee_name || '',
            memo: t.memo || '',
            amount: -t.amount / 1000
        }));

        // Group transactions by Category Group → Category Name
        const grouped = {};

        for (const t of allTransactions) {
            const categoryName = t.category_name;
            const groupName = _categoryGroupMap[categoryName] || 'Ungrouped';

            if (!grouped[groupName]) {
                grouped[groupName] = {};
            }
            if (!grouped[groupName][categoryName]) {
                grouped[groupName][categoryName] = {
                    total: 0,
                    transactions: []
                };
            }

            // Amount: negative = expense, positive = refund
            // Store raw amount for calculations
            grouped[groupName][categoryName].total += t.amount;
            grouped[groupName][categoryName].transactions.push({
                date: t.date,
                type: t.amount < 0 ? 'Expense' : 'Refund',
                payee: t.payee_name || '(No payee)',
                memo: t.memo || '',
                amount: t.amount / 1000, // Convert milliunits
                isPast: new Date(t.date) < today,
                isScheduled: t.source === 'scheduled',
                isFutureYear: t.isFutureYear || false
            });
        }

        // Sort transactions within each category by date
        for (const groupName of Object.keys(grouped)) {
            for (const categoryName of Object.keys(grouped[groupName])) {
                grouped[groupName][categoryName].transactions.sort((a, b) =>
                    new Date(a.date) - new Date(b.date)
                );
                // Convert total from milliunits
                grouped[groupName][categoryName].total /= 1000;
            }
        }

        // Sort groups and categories alphabetically
        const sortedGroups = Object.keys(grouped).sort();

        if (sortedGroups.length === 0) {
            container.innerHTML = '<div class="empty-state">No transactions found for this year</div>';
            return;
        }

        // Build HTML
        let html = `
            <div class="projects-header">
                <button id="toggleAllProjectsBtn" class="outline secondary" onclick="toggleAllProjects(true)">Expand All</button>
            </div>
            <div class="projects-table-wrapper">
                <table class="projects-table">
                    <tbody>
        `;

        let groupIndex = 0;
        for (const groupName of sortedGroups) {
            const categories = grouped[groupName];
            const sortedCategories = Object.keys(categories).sort();

            // Calculate group total (sum of all category totals)
            const groupTotal = sortedCategories.reduce((sum, catName) =>
                sum + categories[catName].total, 0
            );

            // Group header row
            html += `
                <tr class="group-header" data-group-id="${groupIndex}" onclick="toggleGroup(${groupIndex})">
                    <td colspan="3">
                        <span class="collapse-icon" id="group-icon-${groupIndex}">&#9654;</span>
                        ${escapeHtml(groupName)}
                    </td>
                    <td class="amount-col">${formatProjectAmount(-groupTotal)}</td>
                </tr>
            `;

            // Category rows (hidden by default)
            let categoryIndex = 0;
            for (const categoryName of sortedCategories) {
                const category = categories[categoryName];
                const catId = `${groupIndex}-${categoryIndex}`;

                // Category header row
                html += `
                    <tr class="category-header projects-hidden" data-group="${groupIndex}" data-category-id="${catId}" onclick="toggleCategory('${catId}')">
                        <td colspan="3">
                            <span class="collapse-icon" id="cat-icon-${catId}">&#9654;</span>
                            ${escapeHtml(categoryName)}
                        </td>
                        <td class="amount-col">${formatProjectAmount(-category.total)}</td>
                    </tr>
                `;

                // Transaction rows (hidden by default)
                for (const tx of category.transactions) {
                    const pastClass = tx.isPast ? 'past' : '';
                    const scheduledIndicator = tx.isScheduled ? (tx.isFutureYear ? ' 🔮' : ' 📅') : '';
                    const dateStr = new Date(tx.date).toLocaleDateString('en-IE', {
                        day: 'numeric',
                        month: 'short'
                    });

                    html += `
                        <tr class="project-row projects-hidden ${pastClass}" data-category="${catId}">
                            <td class="date-col">${dateStr}${scheduledIndicator}</td>
                            <td class="payee-col">${escapeHtml(tx.payee)}</td>
                            <td class="memo-col">${escapeHtml(tx.memo)}</td>
                            <td class="amount-col">${formatProjectAmount(-tx.amount)}</td>
                        </tr>
                    `;
                }

                categoryIndex++;
            }

            groupIndex++;
        }

        html += `
                    </tbody>
                </table>
            </div>
            <div class="projects-footer">
                <button class="outline secondary" onclick="exportProjectsCSV()">Export as CSV</button>
            </div>
        `;

        container.innerHTML = html;
    }

    function exportProjectsCSV() {
        if (!_projectsExportData || _projectsExportData.length === 0) {
            alert('No data to export. Please refresh data first.');
            return;
        }

        const headers = ['Category UUID', 'Category Group', 'Category Name', 'Date', 'Month', 'Payee', 'Memo', 'Price'];
        const rows = _projectsExportData.map(t => [
            t.category_id,
            t.category_group,
            t.category_name,
            t.date,
            t.month,
            t.payee,
            t.memo,
            t.amount.toFixed(2)
        ]);

        // Build CSV content
        const csvContent = [
            headers.join(','),
            ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        ].join('\n');

        // Download
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `projects_export_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatProjectAmount(amount) {
        const formatted = new Intl.NumberFormat('en-IE', {
            style: 'currency',
            currency: 'EUR',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(Math.abs(amount));

        if (amount < 0) {
            return `<span class="negative">-${formatted}</span>`;
        }
        return formatted;
    }

    function toggleGroup(groupId) {
        const icon = document.getElementById(`group-icon-${groupId}`);
        const categories = document.querySelectorAll(`[data-group="${groupId}"]`);
        const isExpanding = !icon.classList.contains('expanded');

        if (isExpanding) {
            icon.classList.add('expanded');
        } else {
            icon.classList.remove('expanded');
        }

        categories.forEach(row => {
            if (isExpanding) {
                row.classList.remove('projects-hidden');
            } else {
                row.classList.add('projects-hidden');
                // Also collapse any expanded transactions within this category
                const catId = row.dataset.categoryId;
                if (catId) {
                    const catIcon = document.getElementById(`cat-icon-${catId}`);
                    if (catIcon) catIcon.classList.remove('expanded');
                    document.querySelectorAll(`[data-category="${catId}"]`).forEach(txRow => {
                        txRow.classList.add('projects-hidden');
                    });
                }
            }
        });
    }

    function toggleCategory(categoryId) {
        const icon = document.getElementById(`cat-icon-${categoryId}`);
        const transactions = document.querySelectorAll(`[data-category="${categoryId}"]`);
        const isExpanding = !icon.classList.contains('expanded');

        if (isExpanding) {
            icon.classList.add('expanded');
        } else {
            icon.classList.remove('expanded');
        }

        transactions.forEach(row => {
            if (isExpanding) {
                row.classList.remove('projects-hidden');
            } else {
                row.classList.add('projects-hidden');
            }
        });

        // Stop event propagation to prevent toggling parent group
        event.stopPropagation();
    }

    function toggleAllProjects(expand) {
        const btn = document.getElementById('toggleAllProjectsBtn');
        const allGroupIcons = document.querySelectorAll('[id^="group-icon-"]');
        const allCatIcons = document.querySelectorAll('[id^="cat-icon-"]');
        const allCategories = document.querySelectorAll('.category-header');
        const allTransactions = document.querySelectorAll('.project-row');

        if (expand) {
            // Expand all
            allGroupIcons.forEach(icon => icon.classList.add('expanded'));
            allCatIcons.forEach(icon => icon.classList.add('expanded'));
            allCategories.forEach(row => row.classList.remove('projects-hidden'));
            allTransactions.forEach(row => row.classList.remove('projects-hidden'));
            btn.textContent = 'Collapse All';
            btn.onclick = () => toggleAllProjects(false);
        } else {
            // Collapse all
            allGroupIcons.forEach(icon => icon.classList.remove('expanded'));
            allCatIcons.forEach(icon => icon.classList.remove('expanded'));
            allCategories.forEach(row => row.classList.add('projects-hidden'));
            allTransactions.forEach(row => row.classList.add('projects-hidden'));
            btn.textContent = 'Expand All';
            btn.onclick = () => toggleAllProjects(true);
        }
    }

    // ============================================================
    // TAB NAVIGATION
    // ============================================================

    function initTabs() {
        const tabNav = document.getElementById('tabNav');
        const buttons = tabNav.querySelectorAll('button');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active button
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update active tab content
                const tabId = btn.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(tab => {
                    tab.classList.remove('active');
                });
                document.getElementById(`tab-${tabId}`).classList.add('active');
            });
        });
    }

    // ============================================================
    // MAIN REFRESH FLOW
    // ============================================================

    async function refreshData() {
        const settings = loadSettings();

        if (!settings.apiToken || !settings.budgetId) {
            updateStatus('Please configure your YNAB API token and Budget ID', 'error');
            return;
        }

        updateStatus('Fetching from YNAB...');
        document.getElementById('refreshBtn').disabled = true;

        try {
            const data = await fetchYnabData(settings);
            _debugData = data; // Store for debugging
            _transactionsData = data; // Store for transactions tab
            const rows = calculateMonthlyRows(data, settings);
            renderSummaryCards(rows, settings);
            renderWarnings(data._warnings);
            renderPriorityBreakdown(data, rows, settings);
            renderMonthlyTable(rows, settings);

            // Render transactions tab with current month selection
            const txMonthSelect = document.getElementById('transactionsMonth');
            const txMonthIndex = parseInt(txMonthSelect.value, 10);
            renderTransactions(data, settings, txMonthIndex);

            // Render projects tab
            renderProjectsTab(data, settings);

            updateStatusWithWarnings(rows);
            updateLastRefreshed();

            // Show tab navigation after data loads
            document.getElementById('tabNav').style.display = 'flex';
        } catch (error) {
            // Handle specific API errors with helpful messages
            if (error instanceof YnabApiError && (error.type === 'auth' || error.type === 'not_found')) {
                updateStatus(error.message, 'error');
                // Open settings panel for auth/config errors
                document.getElementById('settingsPanel').setAttribute('open', '');
            } else {
                updateStatus(`Error: ${error.message}`, 'error');
            }
            console.error('Refresh error:', error);
        } finally {
            document.getElementById('refreshBtn').disabled = false;
        }
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================

    document.addEventListener('DOMContentLoaded', () => {
        // Populate settings form from localStorage
        populateSettingsForm();

        // Check if settings are complete
        checkSettingsComplete();

        // Initialize tab navigation
        initTabs();

        // Initialize transactions tab
        initTransactionsTab();

        // Initialize projects tab
        initProjectsTab();

        // Event listeners
        document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
        document.getElementById('refreshBtn').addEventListener('click', refreshData);
        document.getElementById('testConnectionBtn').addEventListener('click', testConnection);
        document.getElementById('openSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsPanel').setAttribute('open', '');
        });
    });
    </script>
